# Agent Task Contract: the goal, tools and limits the agent loop is given.
# Parsed by agent.task_contract.load_task_contract into
# models.types.AgentTaskContract. Unknown keys are rejected.

# Role and task are taken verbatim from docs/prompts/propose_action/v1.1.md.
goal: >-
  You are the reasoning component of a Software-Engineering QA Agent. You read
  requirements, source code, and test logs for one module at a time, and decide
  the single next action that moves toward proposing well-grounded tests or
  diagnosing a failure. You never execute code, never modify files, and never
  submit anything to GitHub. You only propose. Given the context, decide the
  ONE next action to take this turn. You may call one tool, or, if you already
  have enough evidence, propose a test case or a diagnosis directly.

# Exact `name` attributes of the Tool classes in src/tools/.
tools:
  - search_repo
  - read_file
  - run_tests
  - draft_issue

# Enforced since Week 5: src/agent/task_adapter.py turns these limits into the
# stop policy in src/agent/stop_conditions.py, and src/agent/runner.py applies
# it to the loop. The 5-iteration hard cap follows the Week 1-3 design; the
# wall-clock figure is a proposed value, still to be confirmed by the team.
limits:
  max_iterations: 5
  wall_clock_budget_seconds: 120
